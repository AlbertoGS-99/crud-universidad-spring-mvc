<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Detalles del profesor</title>
    </head>

    <body>
        <h1 th:text="'Detalles del profesor: '+ ${profesor.nombre}+ ' '+ ${profesor.primerApellido}+ ' ' + ${profesor.segundoApellido}"></h1>
        <h2 th:text="'Facultad: '+ ${profesor.facultad.nombre}"></h2>

        <div th:if="${profesor.fotodelProfesor != null}">
            <h2>Foto del profesor</h2>
            <img th:src="@{/imagenes/} + ${profesor.fotodelProfesor}">
        </div>

        <a th:href="@{/profesores/listar}">Volver</a>
    </body>
</html>
