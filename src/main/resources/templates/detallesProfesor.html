<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Detalles</title>
    </head>
    <body>
        <h1 th:text="'Detalles del Profesor: '+ ${profesor.Nombre}+ ' '+ ${profesor.primerApellido}+ ' ' + ${profesor.segundoApellido}"></h1>
        <h2 th:text="'Facultad: '+ ${profesor.facultad.Nombre}"></h2>
        <h2 th:text="'Fecha de Alta:  '+ ${profesor.fechaAlta}"></h2>
        <h2 th:text="'Salario:' +${profesor.salario}"></h2>
        
        <div th:if="${profesor.foto != null}">
            <h2>Foto del Profesor</h2>
            <img th:src ="@{/imagenes/} + ${profesor.foto}">
        </div>

        <a th:href="@{/profesores/listar}">Volver</a>
    </body>
</html>
